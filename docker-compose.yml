# Local stack: the ZeroWatch service plus Prometheus scraping its metrics.
#   docker compose up --build
#   ZeroWatch   http://localhost:8000      Prometheus  http://localhost:9090
# Useful queries: rate(zerowatch_predictions_total[1m]), zerowatch_drift_state,
#                 histogram_quantile(0.95, rate(zerowatch_inference_seconds_bucket[5m]))
services:
  zerowatch:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    environment:
      # set both to require keys for labelling, retraining and settings (leave empty for open mode)
      ANALYST_TOKEN: ${ANALYST_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    volumes:
      - zerowatch-logs:/app/logs   # prediction log, labels and learned models survive a restart

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [zerowatch]

volumes:
  zerowatch-logs:
