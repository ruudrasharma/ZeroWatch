# Weekly update pull requests, kept deliberately narrow:
#  - the base image digest only (the course requires python:3.11-slim, so no 3.12+ proposals)
#  - GitHub Actions, grouped into one pull request
# Python packages are not included: the serving lock is regenerated by hand from
# requirements-serve.in.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
